<div class="container">
  <footer>
    <div class="footerContainer">
      <div
        class="row"
        data-aos="fade-up"
        data-aos-delay="250"
        data-aos-duration="1000"
        data-aos-easing="ease forwards"
        data-aos-offset="100"
        data-aos-once="true"
      >
        <div>
          <div class="social-icons">
            <div class="button" (click)="redirectToFB()">
              <div class="icon">
                <i class="bx bxl-facebook"></i>
              </div>
            </div>
            <div class="button" (click)="redirectToLinkdin()">
              <div class="icon">
                <i class="bx bxl-linkedin"></i>
              </div>
            </div>
            <div class="button" (click)="redirectToInsta()">
              <div class="icon">
                <i class="bx bxl-instagram-alt"></i>
              </div>
            </div>
            <div class="button" (click)="redirectToYT()">
              <div class="icon">
                <i class="bx bxl-youtube"></i>
              </div>
            </div>
            <div class="button" (click)="redirectToGithub()">
              <div class="icon">
                <i class="bx bxl-github"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="copyright">
        <p>© Copyright {{ currentYear }}. Made by Neeraj Narnolia</p>
      </div>
      <div class="rocketIcon" (click)="scrollToTop()">
        <img id="rocket" src="assets/img/rocket.png" alt="Scroll to Top" />
      </div>
    </div>
  </footer>
</div>
